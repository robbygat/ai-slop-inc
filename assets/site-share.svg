<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#f4f1e9"/>
  <g fill="#21211e" font-family="Arial, sans-serif">
    <text x="55" y="76" font-size="31" font-weight="700" letter-spacing="-1.3">AI Slop Inc.</text>
    <path d="M55 107h1090" stroke="#21211e" stroke-width="1"/>
    <g font-size="67" font-weight="700" letter-spacing="-4">
      <text x="55" y="240">Borrow the good.</text>
      <text x="55" y="317">Fix what’s not.</text>
      <text x="55" y="394">Ship the <tspan fill="#d93822" font-family="Georgia,serif" font-style="italic" font-weight="400">future.</tspan></text>
    </g>
    <text x="55" y="470" font-size="23">AI is inevitable. Let’s make something worth using.</text>
    <text x="55" y="565" font-size="20">Games. Learning. Open software.</text>
  </g>
  <g transform="translate(790 170) rotate(-5 165 170)">
    <rect x="17" y="13" width="325" height="350" fill="#d93822" transform="rotate(10 170 185)"/>
    <rect width="325" height="350" fill="#e7bbce"/>
    <svg x="0" y="14" width="325" height="325" viewBox="512 0 512 512"><image xlink:href="slop-art-portraits.png" width="1536" height="1024"/></svg>
  </g>
</svg>
